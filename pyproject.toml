[project]
name = "nanochat-sandbox"
version = "0.0.1"
description = "Experiment overlays for nanochat (kept pristine; loaded via sys.path)"
requires-python = ">=3.10"
# nanochat itself is NOT installed as a package — its pyproject doesn't declare
# packages/build-system explicitly and we keep it pristine. Instead `overlay/`
# prepends ../nanochat to sys.path so its modules are importable at runtime.
# These deps mirror ../nanochat/pyproject.toml's runtime requirements; keep
# loosely in sync when bumping the pinned nanochat commit.
dependencies = [
    "datasets>=4.0.0",
    "fastapi>=0.117.1",
    "kernels>=0.11.7",
    "psutil>=7.1.0",
    "rustbpe>=0.1.0",
    "tiktoken>=0.11.0",
    "tokenizers>=0.22.0",
    "torch==2.9.1",
    "uvicorn>=0.36.0",
    "wandb>=0.21.3",
]

[project.optional-dependencies]
cpu = ["setuptools>=65.0.0", "torch==2.9.1"]
gpu = ["torch==2.9.1"]

[tool.uv]
conflicts = [[{ extra = "cpu" }, { extra = "gpu" }]]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["overlay", "wrappers"]
